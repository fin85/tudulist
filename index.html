<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>ТудуЛист</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Мои задачи</div>
        <h1>ТудуЛист</h1>
      </div>
      <button id="refreshBtn" class="icon-btn" aria-label="Обновить">↻</button>
    </header>

    <nav class="filters" aria-label="Фильтры">
      <button data-filter="active" class="chip active">Актуальные</button>
      <button data-filter="today" class="chip">Сегодня</button>
      <button data-filter="upcoming" class="chip">Предстоящие</button>
      <button data-filter="nodate" class="chip">Без срока</button>
      <button data-filter="later" class="chip">На потом</button>
      <button data-filter="done" class="chip">Выполненные</button>
    </nav>

    <section class="summary">
      <div><strong id="activeCount">0</strong><span>активных</span></div>
      <div><strong id="todayCount">0</strong><span>на сегодня</span></div>
      <button id="notifyBtn" class="notify-btn">Включить уведомления</button>
    </section>

    <section id="state" class="state">Загрузка…</section>
    <section id="taskList" class="task-list" hidden></section>
  </main>

  <template id="taskTemplate">
    <article class="task-card">
      <label class="check-wrap">
        <input class="task-check" type="checkbox" />
        <span class="fake-check"></span>
      </label>
      <div class="task-content">
        <div class="task-row">
          <h2 class="task-title"></h2>
          <span class="due-badge"></span>
        </div>
        <p class="task-description"></p>
        <div class="task-meta"></div>
        <div class="task-actions">
          <button class="later-btn" type="button">На потом</button>
        </div>
      </div>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
